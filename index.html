<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<title>Bickford Properties</title>
<meta name="description" content="Bickford Properties designs and builds modern multiplex homes in Toronto's established neighbourhoods.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&display=swap">
<style>
  /* Layout: full-bleed dusk hero carrying logo + one line; a slate band with the statement; an asymmetric two-image gallery; a quiet contact block. One look for every viewer (brand site), so colours are set once. */
  :root {
    --slate: #203436;      /* brand deep slate */
    --slate-deep: #172628;
    --cream: #F4F1EA;      /* brand warm cream */
    --bronze: #A38A5F;     /* brand bronze accent */
    --ink: #1d2a2b;
    --muted: #5d6b6a;
    --sans: "Montserrat", "Helvetica Neue", Arial, sans-serif;
    --gutter: clamp(16px, 5vw, 64px);
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--cream);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  img { display: block; max-width: 100%; }
  a { color: inherit; }
  a:focus-visible { outline: 2px solid var(--bronze); outline-offset: 4px; }

  /* Logo: rebuilt vector of the Bickford banner mark, coloured by currentColor */
  .logo { display: block; color: var(--cream); line-height: 0; }
  .logo .mark { width: 100%; height: auto; display: block; }

  /* Hero */
  .hero {
    position: relative;
    min-height: clamp(520px, 86vh, 920px);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding-inline: var(--gutter);
    padding-block: clamp(24px, 4vw, 44px);
    color: var(--cream);
    background: var(--slate-deep) url("img/dusk.webp") center 60% / cover no-repeat;
    isolation: isolate;
  }
  .hero::before {
    content: "";
    position: absolute; inset: 0; z-index: -1;
    background:
      linear-gradient(180deg, rgba(23,38,40,0.55) 0%, rgba(23,38,40,0) 28%),
      linear-gradient(0deg, rgba(23,38,40,0.85) 0%, rgba(23,38,40,0.15) 45%, rgba(23,38,40,0) 70%);
  }
  .hero .logo { width: clamp(150px, 17vw, 230px); }
  .hero h1 {
    margin: 0;
    max-width: 16ch;
    font-weight: 300;
    font-size: clamp(34px, 5.6vw, 72px);
    line-height: 1.08;
    letter-spacing: -0.01em;
    text-wrap: balance;
  }
  .hero .place {
    margin: 18px 0 0;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--bronze);
  }

  /* Statement band */
  .statement {
    background: var(--slate);
    color: var(--cream);
    padding-inline: var(--gutter);
    padding-block: clamp(56px, 9vw, 120px);
  }
  .statement p {
    margin: 0 auto;
    max-width: 30ch;
    text-align: center;
    font-weight: 300;
    font-size: clamp(22px, 3vw, 34px);
    line-height: 1.35;
    text-wrap: balance;
  }
  .statement .rule { width: 48px; height: 1px; background: var(--bronze); margin: 0 auto 32px; }

  /* Gallery: the front elevation leads at ~62% width; a right column stacks the material detail above the square garden view, filling the same height */
  .gallery {
    display: flex;
    gap: clamp(12px, 2vw, 24px);
    padding-inline: var(--gutter);
    padding-block: clamp(48px, 8vw, 110px) 0;
    max-width: 1320px;
    margin: 0 auto;
  }
  .gallery figure { margin: 0; overflow: hidden; background: var(--slate); min-width: 0; }
  .gallery img { width: 100%; height: 100%; object-fit: cover; transition: transform 1.2s ease; }
  .gallery figure:hover img { transform: scale(1.02); }
  .gallery { align-items: stretch; }
  .gallery .front { flex: 62 1 0; aspect-ratio: 4 / 5; }
  .gallery .stack { flex: 38 1 0; min-width: 0; display: flex; flex-direction: column; gap: clamp(12px, 2vw, 24px); }
  .gallery .top { flex: 1 1 0; min-height: 0; }
  .gallery .detail { aspect-ratio: 1 / 1; flex: none; }

  /* Contact */
  .contact {
    padding-inline: var(--gutter);
    padding-block: clamp(64px, 10vw, 140px);
    text-align: center;
  }
  .contact h2 {
    margin: 0 0 14px;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .contact a.mail {
    font-weight: 300;
    font-size: clamp(22px, 3.4vw, 38px);
    text-decoration: none;
    border-bottom: 1px solid var(--bronze);
    padding-bottom: 4px;
    overflow-wrap: anywhere;
  }
  .contact a.mail:hover { color: var(--slate); border-bottom-width: 2px; }

  footer {
    background: var(--slate-deep);
    color: rgba(244,241,234,0.7);
    padding-inline: var(--gutter);
    padding-block: 28px;
    display: flex;
    flex-wrap: wrap;
    gap: 12px 24px;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
    letter-spacing: 0.08em;
  }
  footer .logo { width: 110px; }

  @media (max-width: 640px) {
    .gallery { flex-direction: column; }
    .gallery .front, .gallery .stack { flex: none; width: 100%; }
    .gallery .top { flex: none; aspect-ratio: 1 / 1; }
    .hero { min-height: 560px; background-position: 62% center; }
  }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .gallery img { transition: none; }
  }
</style>

</head>
